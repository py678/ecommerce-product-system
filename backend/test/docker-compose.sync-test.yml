services:
  db-a:
    image: postgres:18-bookworm
    environment:
      POSTGRES_PASSWORD: disposable-test-password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      retries: 20
  db-b:
    image: postgres:18-bookworm
    environment:
      POSTGRES_PASSWORD: disposable-test-password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      retries: 20
  tester:
    build:
      context: ..
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:disposable-test-password@db-a:5432/postgres
      PEER_DATABASE_URL: postgresql://postgres:disposable-test-password@db-b:5432/postgres
      SYNC_DISPOSABLE_TEST: '1'
    command: [node, --test, scripts/sync.integration.test.ts]
    depends_on:
      db-a:
        condition: service_healthy
      db-b:
        condition: service_healthy
