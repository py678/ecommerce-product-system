map $http_upgrade $socket_connection { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Allow a 5MB image plus multipart framing; Nest/Multer enforces the exact file limit.
    client_max_body_size 6m;

    # Docker DNS resolves a recreated backend without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://backend:3000;

    location /socket.io/ {
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $socket_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /uploads/ {
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
    }

    location ~ ^/docs(?:/|$|-json$) {
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
